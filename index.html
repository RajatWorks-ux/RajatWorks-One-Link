  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rajatworks001.vercel.app/">
  <meta property="og:site_name" content="RajatWorks">
  <meta property="og:title" content="RajatWorks — Rajat Kumar Dua">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RajatWorks — Rajat Kumar Dua">

  <meta name="twitter:image" content="https://rajatworks001.vercel.app/social-preview.jpg">
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#0b080c; color:#f7f3f8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; }
    main { width:min(100%, 520px); text-align:center; }
    .mark { margin:0 auto 20px; width:58px; height:58px; display:grid; place-items:center; border:1px solid #594b60; border-radius:18px; color:#d7b6ff; font-weight:800; font-size:24px; }
    h1 { margin:0; letter-spacing:-.04em; font-size:clamp(2rem, 8vw, 3.25rem); }
    p { color:#b9afbd; line-height:1.6; }
    .links { display:flex; justify-content:center; flex-wrap:wrap; gap:12px; margin-top:24px; }
    a { color:#f7f3f8; border:1px solid #574b5c; border-radius:999px; padding:12px 18px; text-decoration:none; }
    a:hover, a:focus-visible { border-color:#d7b6ff; outline:none; }
    .status { font-size:.9rem; min-height:1.5em; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">RW</div>
    <h1>RajatWorks</h1>
    <p class="status" id="status" role="status" aria-live="polite">Choosing the best portfolio for this screen…</p>
    <div class="links" aria-label="Choose a portfolio manually">
      <a id="desktop-link" href="https://rajatworks1.vercel.app/">Desktop 3D portfolio</a>
      <a id="mobile-link" href="https://rajatworks01.vercel.app/">Phone / tablet portfolio</a>
    </div>
    <noscript><p>JavaScript is required for automatic device selection. Use one of the links above.</p></noscript>
  </main>
  <script>
    /* Update these two URLs if the portfolios are redeployed to different addresses. */
    const TARGETS = {
      desktop: "https://rajatworks1.vercel.app/",
      mobile: "https://rajatworks01.vercel.app/"
    };
    const desktopLink = document.getElementById("desktop-link");
    const mobileLink = document.getElementById("mobile-link");
    desktopLink.href = TARGETS.desktop;
    mobileLink.href = TARGETS.mobile;

    function chooseExperience() {
      const params = new URLSearchParams(window.location.search);
      const forced = params.get("view");
      if (forced === "desktop" || forced === "mobile") return forced;

      const ua = navigator.userAgent || "";
      const mobileUA = /Android|iPhone|iPad|iPod|IEMobile|BlackBerry|Opera Mini/i.test(ua);
      // iPadOS can report a Mac desktop UA; multiple touch points helps catch it.
      const hasMultipleTouchPoints = navigator.maxTouchPoints > 1;
      const coarsePrimaryPointer = window.matchMedia("(pointer: coarse)").matches;
      const touchTablet = hasMultipleTouchPoints && (coarsePrimaryPointer || /Macintosh/i.test(ua));
      // Never route by viewport width: minimized/narrow laptops stay on desktop.
      // CSS in the desktop portfolio handles the smaller layout.
      return mobileUA || touchTablet ? "mobile" : "desktop";
    }

    const choice = chooseExperience();
    const destination = TARGETS[choice];
    document.getElementById("status").textContent = choice === "mobile"
      ? "Opening the phone and tablet portfolio…"
      : "Opening the 3D desktop portfolio…";
    // Keep a visible fallback if navigation is blocked; replace avoids a back-button loop.
    window.setTimeout(() => { window.location.replace(destination); }, 180);
  </script>
</body>
</html>
